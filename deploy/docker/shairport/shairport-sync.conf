// P49 Docker — AirPlay 2 receiver (host network)
// iPhone name: render on Pi with ./bin/render-shairport-config.sh --stage beta
// then copy rendered config here, or edit `name` below before ./bin/p49-up.sh

general =
{
  name = "AirPlay Status (Beta)";
  output_backend = "pipe";
  mdns_backend = "avahi";
  interpolation = "basic";
  ignore_volume_control = "yes";
  port = 7000;
  regtype = "_airplay._tcp";
};

pipe =
{
  name = "/dev/null";
};

metadata =
{
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};

diagnostics =
{
  log_verbosity = 1;
};
