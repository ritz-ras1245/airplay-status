# Deploy P49 beta to Raspberry Pi (scaffold)
#
# GitHub Free: workflow_dispatch + repository/environment secrets + SSH deploy — all allowed
# on public repos. See docs/p49-beta-remote-deploy.md.
#
# SCAFFOLD: wire secrets and remote script after Pi Phase 0 SSH works.
# Secrets (repo or environment "beta"):
#   P49_SSH_PRIVATE_KEY — deploy key private half
#   P49_HOST              — e.g. airplay-beta.local
#   P49_SSH_USER          — SSH user on Pi
#   P49_DEPLOY_PATH       — optional, default ~/airplay-status

name: Deploy P49 beta

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (SHA or branch) to deploy
        required: true
        default: main
      stage:
        description: Deploy stage
        required: true
        default: beta
        type: choice
        options:
          - beta
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Checkout (for metadata only)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Scaffold notice
        run: |
          echo "SCAFFOLD — git+npm deploy is retired."
          echo "How we update: ./bin/p49-build-release.sh && ./bin/p49-push-release.sh rasohoni@pi.home.arpa"
          echo "Optional later: this workflow can scp the tarball as rasohoni (not r-bot; r-bot has no sudo)."
          echo "Build workflow: .github/workflows/p49-build-release.yml"
          echo "See DECISIONS.md and docs/p49-beta-remote-deploy.md"
          exit 0
