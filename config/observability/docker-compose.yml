# Mac observability stack — Loki + Grafana (+ optional Mac Promtail).
# Pi Promtail pushes journal logs to Loki on port LOKI_PORT (LAN).
#
# Copy observability.env.example → observability.env and set Grafana password.

services:
  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
    restart: unless-stopped

  promtail-mac:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail-mac.yml:/etc/promtail/promtail.yml:ro
      - ${MAC_LOG_DIR:-/tmp/airplay-status-logs}:/var/log/airplay-status:ro
    depends_on:
      - loki
    restart: unless-stopped
    profiles:
      - mac-logs

volumes:
  loki-data:
  grafana-data:
