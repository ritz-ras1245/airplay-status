# Promtail on Mac — tails local dev/prod log files into Loki (optional).
# Pi logs arrive via deploy/rpi/promtail (journal → Mac Loki).

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-mac-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: airplay-mac-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: airplay-status
          host: mac-dev
          __path__: /var/log/airplay-status/*.log
